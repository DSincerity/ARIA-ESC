[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-esc"
version = "1.0.0"
description = "Reference implementation of ARIA: affect-grounded preference alignment for emotional-support dialogue"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "accelerate>=0.34",
  "anthropic>=0.40",
  "datasets>=2.18",
  "numpy>=1.24",
  "openai>=1.0",
  "peft>=0.13",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "transformers>=4.46,<4.50",
  "trl>=0.15,<0.17"
]

[tool.setuptools.packages.find]
where = ["src"]
